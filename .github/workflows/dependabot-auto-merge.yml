# Enable auto-merge for Dependabot minor and patch updates.
# GitHub merges the PR only after all required status checks (CI workflow)
# have passed. Major updates are left open for manual review.
#
# Repository prerequisites:
#   - Settings → General → "Allow auto-merge" enabled
#   - A branch ruleset on main requiring the CI checks (lint, secrets, bats,
#     pytest (Checkmk 2.4), pytest (Checkmk 2.5), mkp) to pass before merging
name: Dependabot Auto-Merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98  # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Enable auto-merge for minor and patch updates
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
