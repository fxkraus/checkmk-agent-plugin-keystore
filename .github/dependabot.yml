# Dependabot configuration — weekly dependency updates.
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
#
# Minor/patch updates are grouped into a single PR per ecosystem. uv and
# pre-commit updates are auto-merged by the companion workflow
# (.github/workflows/dependabot-auto-merge.yml) once the CI checks pass; Docker
# and GitHub Actions updates and all major updates need a manual review.
#
# NOTE: Dependabot's Docker ecosystem only detects files matching
# the Dockerfile* / *.Dockerfile naming pattern, and only FROM lines with a
# literal tag (FROM image:${ARG} is not updated).
#
# build/Dockerfile is not listed: it uses the floating checkmk 2.5.0-latest tag
# on purpose (latest stable patch release, pulled by CI on every build).
#
# Checkmk image tags: Dependabot compares 2.4.0pNN as a pre-release of 2.4.0,
# and the daily builds 2.4.0-YYYY.MM.DD as the release 2.4.0.YYYY.MM.DD, so
# every daily build outranks every patch release. Ignoring ">= 2.4.0" keeps
# only the 2.4.0pNN patch releases and also blocks 2.5+.

version: 2
updates:
  # ── Python dev dependencies (pyproject.toml + uv.lock) ─────────────────────
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"

  # ── Docker (devcontainer — CheckMK) ────────────────────────────────────────
  - package-ecosystem: "docker"
    directory: "/.devcontainer/checkmk"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "checkmk/check-mk-cloud"
        versions: [">= 2.4.0"]  # see the Checkmk note at the top

  # ── Docker (devcontainer — AlmaLinux) ────────────────────────────────────
  - package-ecosystem: "docker"
    directory: "/.devcontainer/almalinux"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "almalinux"
        versions: [">= 10"]

  # ── pre-commit hooks ───────────────────────────────────────────────────────
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"

  # ── GitHub Actions ─────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
