# Dependabot configuration — weekly dependency updates.
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
#
# Minor/patch updates are grouped into a single PR per ecosystem and
# auto-merged by the companion workflow (.github/workflows/dependabot-auto-merge.yml)
# once the CI checks pass. Major updates create individual PRs for manual review.
#
# NOTE: Dependabot's Docker ecosystem only detects files matching
# the Dockerfile* / *.Dockerfile naming pattern, and only FROM lines with a
# literal tag (FROM image:${ARG} is not updated).

version: 2
updates:
  # ── Python (devcontainer) ──────────────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/.devcontainer"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"

  # ── Docker (devcontainer — CheckMK) ────────────────────────────────────────
  - package-ecosystem: "docker"
    directory: "/.devcontainer/checkmk"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "checkmk/check-mk-cloud"
        versions: [">= 2.5.0"]

  # ── Docker (devcontainer — AlmaLinux) ────────────────────────────────────
  - package-ecosystem: "docker"
    directory: "/.devcontainer/almalinux"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "almalinux"
        versions: [">= 10"]

  # ── Docker (build) ─────────────────────────────────────────────────────────
  - package-ecosystem: "docker"
    directory: "/build"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"

  # ── pre-commit hooks ───────────────────────────────────────────────────────
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"

  # ── GitHub Actions ─────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
